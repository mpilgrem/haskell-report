spec-version: 0.36.0

name: haskell2024-language-report
version: 0.1.0.0
category: Language

dependencies:
- base == 4.20.2.0
- array == 0.5.8.0

default-extensions:
- NoImplicitPrelude
- PackageImports

ghc-options:
- -Wno-missing-methods
- -Werror=orphans

library:
  source-dirs: src
  exposed-modules:
  - Control.Monad
  - Data.Array
  - Data.Bits
  - Data.Char
  - Data.Complex
  - Data.Int
  - Data.Ix
  - Data.List
  - Data.Maybe
  - Data.Ratio
  - Data.Word
  - Foreign
  - Foreign.C
  - Foreign.C.Error
  - Foreign.C.String
  - Foreign.C.Types
  - Foreign.ForeignPtr
  - Foreign.Marshal
  - Foreign.Marshal.Alloc
  - Foreign.Marshal.Array
  - Foreign.Marshal.Error
  - Foreign.Marshal.Utils
  - Foreign.Ptr
  - Foreign.StablePtr
  - Foreign.Storable
  - Numeric
  - System.Environment
  - System.Exit
  - System.IO
  - System.IO.Error
